[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eddy"
version = "0.1.0"
description = "Agent Eddy Router — adaptive multi-objective Pareto-skyline routing for agentic data integration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []  # stdlib-only core

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
eval = ["numpy>=1.24", "matplotlib>=3.7", "pandas>=2.0", "pyarrow>=14.0", "tiktoken>=0.5", "scipy>=1.11", "huggingface_hub>=0.20"]
dev = ["pytest>=7.4", "numpy>=1.24", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["eddy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
